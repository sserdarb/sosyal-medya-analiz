server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Served under the shared PPG domain subpath (baseHref matches this).
    # `^~` gives this prefix priority over the `~* \.(js|css…)$` regex block
    # above — otherwise that regex intercepts subpath asset requests and
    # resolves them with `root` (wrong path) → 404 on the Angular bundle.
    location ^~ /toolbox/sosyal-medya/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /toolbox/sosyal-medya/index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
